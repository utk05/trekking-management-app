{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <h2>Participants: {{ trek['name'] }}</h2>
  <table class="table table-bordered">
    <thead>
      <tr><th>Name</th><th>Email</th><th>Booking Date</th><th>Status</th></tr>
    </thead>
    <tbody>
      {% for p in participants %}
      <tr>
        <td>{{ p['user_name'] }}</td>
        <td>{{ p['user_email'] }}</td>
        <td>{{ p['booking_date'] }}</td>
        <td>{{ p['status'] }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
