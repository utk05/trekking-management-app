{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <h2>Manage Trek: {{ trek['name'] }}</h2>
  <form method="POST">
    <div class="mb-3">
      <label>Available Slots</label>
      <input type="number" name="available_slots" class="form-control" value="{{ trek['available_slots'] }}" required>
    </div>
    <div class="mb-3">
      <label>Status</label>
      <select name="status" class="form-control" required>
        {% for s in ['Pending', 'Approved', 'Open', 'Closed', 'Completed'] %}
        <option value="{{ s }}" {% if trek['status']==s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
