{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <h2>All Bookings</h2>
  <table class="table table-bordered">
    <thead>
      <tr><th>Booking ID</th><th>User</th><th>Trek</th><th>Booking Date</th><th>Status</th></tr>
    </thead>
    <tbody>
      {% for b in bookings %}
      <tr>
        <td>{{ b['id'] }}</td>
        <td>{{ b['user_name'] }}</td>
        <td>{{ b['trek_name'] }}</td>
        <td>{{ b['booking_date'] }}</td>
        <td>{{ b['status'] }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
