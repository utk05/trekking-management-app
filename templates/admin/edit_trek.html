{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <h2>Edit Trek</h2>
  <form method="POST">
    <div class="mb-3">
      <label>Name</label>
      <input type="text" name="name" class="form-control" value="{{ trek['name'] }}" required>
    </div>
    <div class="mb-3">
      <label>Location</label>
      <input type="text" name="location" class="form-control" value="{{ trek['location'] }}" required>
    </div>
    <div class="mb-3">
      <label>Difficulty</label>
      <select name="difficulty" class="form-control" required>
        <option value="Easy" {% if trek['difficulty']=='Easy' %}selected{% endif %}>Easy</option>
        <option value="Moderate" {% if trek['difficulty']=='Moderate' %}selected{% endif %}>Moderate</option>
        <option value="Hard" {% if trek['difficulty']=='Hard' %}selected{% endif %}>Hard</option>
      </select>
    </div>
    <div class="mb-3">
      <label>Duration (days)</label>
      <input type="number" name="duration" class="form-control" value="{{ trek['duration'] }}" required>
    </div>
    <div class="mb-3">
      <label>Available Slots</label>
      <input type="number" name="available_slots" class="form-control" value="{{ trek['available_slots'] }}" required>
    </div>
    <div class="mb-3">
      <label>Status</label>
      <select name="status" class="form-control" required>
        {% for s in ['Pending', 'Approved', 'Open', 'Closed', 'Completed'] %}
        <option value="{{ s }}" {% if trek['status']==s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label>Start Date</label>
      <input type="date" name="start_date" class="form-control" value="{{ trek['start_date'] }}" required>
    </div>
    <div class="mb-3">
      <label>End Date</label>
      <input type="date" name="end_date" class="form-control" value="{{ trek['end_date'] }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
  </form>

  <form method="POST" action="{{ url_for('admin.delete_trek', trek_id=trek['id']) }}" onsubmit="return confirm('Delete this trek?');" class="mt-3">
    <button type="submit" class="btn btn-danger">Delete Trek</button>
  </form>
</div>
{% endblock %}
