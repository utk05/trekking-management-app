{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <h2>Admin Dashboard</h2>
  <a href="{{ url_for('admin.create_trek') }}" class="btn btn-success mb-3">+ New Trek</a>
  <a href="{{ url_for('admin.list_treks') }}" class="btn btn-secondary mb-3">View All Treks</a>
  <a href="{{ url_for('admin.list_staff') }}" class="btn btn-secondary mb-3">Manage Staff</a>
  <a href="{{ url_for('admin.list_users') }}" class="btn btn-secondary mb-3">Manage Users</a>
  <a href="{{ url_for('admin.list_bookings') }}" class="btn btn-secondary mb-3">View All Bookings</a>
  <div class="row mt-4">
    <div class="col-md-3">
      <div class="card text-center p-3">
        <h5>Total Treks</h5>
        <p class="fs-3">{{ total_treks }}</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center p-3">
        <h5>Total Users</h5>
        <p class="fs-3">{{ total_users }}</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center p-3">
        <h5>Total Staff</h5>
        <p class="fs-3">{{ total_staff }}</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center p-3">
        <h5>Total Bookings</h5>
        <p class="fs-3">{{ total_bookings }}</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
